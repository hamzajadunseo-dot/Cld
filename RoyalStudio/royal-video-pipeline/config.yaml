# Royal Family Video Pipeline - settings
# Paths can be absolute or relative to this folder. Use forward slashes.

paths:
  library: ../Royal_Media_Library     # the library folder sits next to royal-video-pipeline (portable)
  data_dir: data                # index.db, caches, reports
  models_dir: data/models       # face models are downloaded here on first run

# ---------------------------------------------------------------- Stage 1: indexer
index:
  image_extensions: [.jpg, .jpeg, .png, .webp]
  video_extensions: [.mp4, .mov, .mkv, .webm, .avi, .m4v]
  audio_extensions: [.mp3, .wav, .m4a, .flac, .ogg]
  work_image_side: 1600         # images are downscaled to this for analysis (originals untouched)
  duplicate_similarity: 0.93    # CLIP similarity above which two visuals count as the same shot

faces:
  enabled: true
  det_size: 640
  det_threshold: 0.5
  min_face_px: 36               # ignore tiny faces (crowds, far background)
  match_threshold: 0.40         # cosine similarity needed to tag a person (higher = stricter)
  match_margin: 0.06            # best person must beat the runner-up by this much
  frames_per_shot: 3            # video frames sampled per shot for face tagging

captions:
  enabled: true
  model: claude-haiku-4-5       # cheap + good at describing images; ~$2-3 per 1,000 assets
  max_image_side: 1024          # image is shrunk before upload to save tokens
  workers: 4                    # parallel API requests

clip:
  enabled: true
  model: ViT-L-14-quickgelu
  pretrained: openai

scenes:
  sample_fps: 4                 # frames per second looked at while scanning a video
  scan_width: 1280              # frames are analysed at this width
  threshold: 30.0               # colour change that counts as a cut (lower = more cuts)
  min_shot_sec: 1.5             # shots shorter than this are dropped
  max_shot_sec: 15.0            # long shots are split into chunks of this size

# ---------------------------------------------------------------- Stage 4/5 rules (used later)
rules:
  no_repeat_within_sec: 60
  max_uses_per_video: 2         # one shot never appears more than twice in a video
  max_clip_shot_sec: 5
  photo_min_sec: 3
  photo_max_sec: 6
  change_visual_every_sec: [2.5, 5.0]   # reference edit: median 3.6 s, average 3.9 s per shot

output:
  width: 1920
  height: 1080
  fps: 30
  timeline_format: premiere_xml   # Premiere Pro (FCP7 XML)

# ---------------------------------------------------------------- Stage 2: voiceover
whisper:
  model: large-v3-turbo         # fast + accurate; downloaded once (~1.6 GB)
  language: en

segments:
  min_sec: 3.0
  max_sec: 8.0

# ---------------------------------------------------------------- Stage 3: script analysis
analysis:
  model: claude-opus-5-5        # reads the whole script to resolve "he", "the King", "his son"
  effort: medium
  chunk_segments: 40

# names the narrator may use for each person folder (helps Claude + the no-API fallback)
people_aliases:
  King_Charles: [King Charles, Charles, King Charles III, Charles III, the King, Prince Charles]
  Queen_Camilla: [Queen Camilla, Camilla, Duchess of Cornwall, Queen Consort, Camilla Parker Bowles]
  Prince_William: [Prince William, William, Duke of Cambridge, Prince of Wales]
  Princess_Catherine: [Princess Catherine, Catherine, Kate, Kate Middleton, Duchess of Cambridge, Princess of Wales]
  Prince_Harry: [Prince Harry, Harry, Duke of Sussex]
  Meghan_Markle: [Meghan, Meghan Markle, Duchess of Sussex]
  Queen_Elizabeth_II: [Queen Elizabeth, Queen Elizabeth II, Elizabeth II, the late Queen, Her Late Majesty]
  Princess_Anne: [Princess Anne, Anne, Princess Royal]
  Princess_Diana: [Princess Diana, Diana, Lady Diana, Lady Di]
  Prince_Edward: [Prince Edward, Edward, Earl of Wessex]

# ---------------------------------------------------------------- Stage 4: matching
matching:
  min_score: 2.0                # below this a moment is logged in missing_assets.txt
  allow_unlicensed: true        # your own clips without _metadata.json (listed separately in credits.txt)
  clip_ratio: 0.85              # share of video clips; photos only where no good clip exists (user: use the clips)
  history_penalty: 0.25         # per earlier video that already used a shot (fresh footage every video)
  history_penalty_max: 2.0

# ---------------------------------------------------------------- Stage 5: render
render:
  crossfade_sec: 0.4
  ken_burns_zoom: 0.10          # photos zoom 10% over their time on screen
  x264_preset: veryfast         # slower = smaller file, same quality
  crf: 20                       # lower = higher quality
  clean_film_scratches: true    # remove baked-in "old film" scratches & dust from clips
  clip_edge_crop: 0.04          # trim 4% off clip edges (burned film borders)

audio:                          # user 2026-10-14: no background music and no SFX from now on
  music: false                  # true (or make_video --with-music) = background music again
  sfx: false                    # true (or --with-sfx) = shutter / stop-down / pop sound effects again

music:
  volume_db: -16                # music level under the voice (it ducks further while speaking)
  hook_boost_db: 5              # music is this much louder during the hook (cold-open energy)

# ---------------------------------------------------------------- hook + on-screen text
hook:
  clips_only: true              # the hook uses video clips only (no photos / collages) - user rule
  subject_only: true            # the hook shows ONLY the main subject (e.g. Harry), never other people or stock - user rule
  stock_concepts: [montecito, beverly_hills, mansion]   # place stock allowed in the hook when the line is about it
  cut_every_sec: [2.5, 5.0]     # same pace as the rest (reference edit: ~3.6 s per shot in the hook too)
  default_sec: 0                # scripts without a '## HOOK' heading: fast cuts for the first N seconds (0 = off)

callouts:
  enabled: true
  name_sec: 3.5                 # how long a name lower third stays
  name_repeat_sec: 90           # same person is named again only after this
  date_sec: 3.0
  date_gap_sec: 12
  event_sec: 3.5
  event_repeat_sec: 120
  # titles that changed hands (Prince of Wales = Charles until 2022, William after): no name card,
  # because the right person depends on the story's year
  skip_aliases: [Prince of Wales, Princess of Wales, Duke of Cambridge, Duchess of Cambridge, Duchess of Cornwall]
  # phrase in the script -> text shown (lower third with an EVENT tag). Add your own.
  events:
    Oprah interview: The Oprah Interview · 2021
    Netflix documentary: Netflix Series 'Harry & Meghan' · 2022
    memoir, Spare: Memoir 'Spare' · 2023
