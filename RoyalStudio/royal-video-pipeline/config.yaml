# ---------------------------------------------------------------- editing style (newsroom documentary)
style:
  enabled: true
  layouts:            # share of shots per layout (split / collage only when they make sense)
    full: 0.50
    card: 0.35        # framed inset with white border + shadow on an animated background
    split: 0.08       # two people side by side
    collage: 0.07     # three polaroid photos
  card_backgrounds: {navy: 1.0}   # LOCKED by user 2026-10-08: navy + white crosses + red/white stripe only
  rounded_share: 0.25            # cards with rounded corners instead of a white border
  transitions: {cut: 0.55, flash: 0.20, leak: 0.20, fade: 0.05}
  hook_transitions: {cut: 0.55, flash: 0.20, leak: 0.20, fade: 0.05}   # same mix as the body
  bw_before_year: 1995           # older photos are shown in black & white
  hook_captions: false           # NO subtitles/captions in videos (user decision 2026-10-08) - keep off
  sfx:
    enabled: true
    # loudness of each effect's loudest moment (dBFS). The voice sits around -17.
    levels_db: {whoosh: -18, impact: -17, sub_drop: -15, riser: -21, swish: -24, shutter: -16, paper: -24, pop: -27}
    callout_pop: true            # tiny pop when a name / event card appears

# ---------------------------------------------------------------- stock footage (Pexels)
# Needs PEXELS_API_KEY in .env. When a segment mentions one of these words, one shot in that
# segment becomes a matching stock clip (also allowed in the hook - it follows the script).
stock:
  enabled: true
  clips_per_concept: 5          # downloaded once, reused by every future video
  max_share: 0.06               # user 2026-10-14: stock LESS - at most ~6% of shots (was 15%)
  min_gap_sec: 30               # never two stock shots closer than this (was 8)
  skip_first_sec: 150           # the opening (hook + start of chapter 1) is royal footage only
  concepts:
    court:      {words: [court, courts, courtroom, judge, judges, lawsuit, court appeal, security appeal, lost his appeal, ruling, legal battle, Court of Appeal], query: courtroom judge gavel}
    lawyer:     {words: [lawyer, lawyers, legal, solicitor, attorney, lawyers on calls], query: lawyer reviewing documents}
    hospital:   {words: [hospital, surgery, surgeon, operation, doctors, medical team, ward, wards, hospices, clinic], query: hospital corridor doctor}
    treatment:  {words: [chemotherapy, treatment, cancer, diagnosis, diagnosed, recovery, prosthetic, amputation], query: chemotherapy hospital treatment}
    report:     {words: [medical review, test, tests, results, scan, report, records, medical report], query: medical test report document}
    newspaper:  {words: [newspaper, newspapers, front pages, front page, headlines, tabloid, tabloids, press], query: newspaper printing press headlines}
    broadcast:  {words: [broadcasters, television, news cycle, cameras rolling, morning show, studio], query: tv news studio broadcast}
    podcast:    {words: [podcast, interview, microphone, radio], query: podcast microphone studio}
    documents:  {words: [document, documents, paperwork, letters patent, trademark, statement, draft, folder, signed, contract], query: official documents signing stamp}
    phone:      {words: [phone, phone call, phone calls, text message, on the phone, email, video message], query: smartphone message hand}
    paparazzi:  {words: [photographers, paparazzi, camera flashes, drone, picture agencies], query: press photographers camera flash}
    money:      {words: [money, millions, million dollars, debts, mortgage, income, finances, bankrupt, funding], query: money counting cash}
    flowers:    {words: [flowers, tributes, railings, cards tied, candles], query: flowers tribute memorial}
    plane:      {words: [flew, flight, flights, airport, plane, Atlantic], query: airplane takeoff clouds}
    montecito:  {words: [Montecito, Montecito home, Montecito estate, Montecito property], query: luxury mansion estate aerial california, count: 12}
    beverly_hills: {words: [Beverly Hills, Beverly Hills estate], query: beverly hills mansion aerial, count: 8}
    mansion:    {words: [mansion, estate, luxury estate, property, residence], query: luxury mansion gate, count: 10}
    calendar:   {words: [diary, schedule, calendar, timetable, diary secretary], query: calendar planner schedule}
    crowd:      {words: [crowd, crowds, fans, well-wishers, people at the gates, small groups], query: crowd gathering street london}
    letters:    {words: [letters, letter, handwritten, cards tied, thank-you card, gift card], query: handwritten letter envelope}
    social:     {words: [online, internet, social media, trend, viral, comments, platforms], query: scrolling social media phone}

# ---------------------------------------------------------------- pacing (copied from the reference edit)
pacing:
  target_shot_sec: 3.6          # reference: median 3.6 s / average 3.9 s per shot, hook and body alike
  min_shot_sec: 1.5             # cuts always land on a narrator pause (breath, comma, sentence end)
